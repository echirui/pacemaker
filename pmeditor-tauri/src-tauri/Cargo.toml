[package]
name = "pacemaker-editor"
version = "1.0.0"
description = "Native Tonium Pacemaker Editor in Rust & Tauri"
authors = ["OpenPacemaker Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pacemaker-core = { path = "../../pacemaker-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
tauri = { version = "2.7", features = [] }
tauri-plugin-log = "2"
