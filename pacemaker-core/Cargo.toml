[package]
name = "pacemaker-core"
version = "0.1.0"
edition = "2021"
description = "Clean-room Rust implementation of Tonium Pacemaker firmware engine and uploader"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
